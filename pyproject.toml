[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon-agent"
version = "0.1.0"
description = "AUREON autonomous execution and cognitive-agent runtime"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
